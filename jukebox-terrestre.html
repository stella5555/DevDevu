<title>Jukebox Terrestre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Major+Mono+Display&display=swap">
<style>
  /* Layout: consola de una sola pantalla. Línea temporal arriba, visor de imagen a la izquierda,
     telemetría + jukebox a la derecha, bitácora abajo. Un solo mundo visual oscuro, por decisión. */
  :root {
    color-scheme: dark;
    --void: #080b10;        /* fondo: negro con sesgo azul */
    --panel: #0e131b;       /* superficie de panel */
    --line: #253041;        /* bordes y retícula */
    --fg: #e9dfc9;          /* texto: blanco cálido */
    --dim: #8b93a1;         /* texto secundario */
    --amber: #f0a63c;       /* acento principal: fogata / fósforo ámbar */
    --amber-soft: rgba(240, 166, 60, 0.14);
    --signal: #7be0a4;      /* señal viva: verde terminal */
    --alert: #ef7b6a;
    --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    --font-display: "Major Mono Display", "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --fs-xs: 0.72rem; --fs-sm: 0.82rem; --fs-md: 0.95rem; --fs-xl: clamp(1.25rem, 3.4vw, 1.9rem);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--void);
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: var(--fs-md);
    line-height: 1.55;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .console { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; }

  .label { font-size: var(--fs-xs); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin: 0; font-weight: 400; }
  .ghost { appearance: none; background: none; border: 1px solid var(--line); color: var(--fg); font: inherit;
           font-size: var(--fs-sm); padding: 6px 10px; cursor: pointer; }
  .ghost:hover { border-color: var(--amber); color: var(--amber); }
  .ghost[aria-pressed="true"] { border-color: var(--signal); color: var(--signal); }
  .head-tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }

  /* Lectura accesible: texto más grande y más contraste en toda la consola */
  .console.a11y { font-size: 1.12rem; line-height: 1.7; --fs-xs: 0.92rem; --fs-sm: 1rem; --dim: #c6cdd8; --line: #5b6b84; }
  .access h3, .log h3 { font-size: var(--fs-xs); letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber);
                        margin: 14px 0 4px; font-weight: 500; }
  .access p { margin: 0 0 6px; max-width: 72ch; }

  /* Progresión: misiones bloqueadas, desbloqueo y barra de progreso */
  .stop[aria-disabled="true"] { cursor: not-allowed; }
  .stop[aria-disabled="true"] .year, .stop[aria-disabled="true"] .name,
  .stop[aria-disabled="true"]:hover .year { color: var(--dim); opacity: 0.75; }
  .stop .seen.lock { color: var(--dim); display: inline-flex; gap: 5px; align-items: center; }
  .stop.fresh::before { background: var(--signal); border-color: var(--signal); animation: ping 1.4s ease-out 3; }
  @keyframes ping { from { box-shadow: 0 0 0 0 var(--signal); } to { box-shadow: 0 0 0 16px transparent; } }
  .progress { height: 6px; background: var(--line); margin-top: 12px; }
  .progress > div { height: 100%; background: var(--signal); }
  .unlock { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
            border: 1px solid var(--signal); color: var(--signal); background: rgba(123, 224, 164, 0.08);
            padding: 12px 16px; animation: flash 1.2s ease-out; }
  .unlock b { color: var(--fg); font-weight: 600; }
  @keyframes flash { from { background: rgba(123, 224, 164, 0.45); } }
  .reveal { animation: rise 1.2s ease-out; }
  .foot { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: center;
          font-size: var(--fs-xs); color: var(--dim); }

  /* Cabecera */
  .head { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between;
          border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .head h1 { font-family: var(--font-display); font-weight: 400; font-size: var(--fs-xl); margin: 0;
             color: var(--amber); letter-spacing: 0.04em; text-wrap: balance; }
  .head p { margin: 2px 0 0; color: var(--dim); font-size: var(--fs-sm); }
  .status { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--dim); }
  .status .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .status.live { color: var(--signal); }
  .status.live .lamp { background: var(--signal); box-shadow: 0 0 10px var(--signal); animation: pulse 1.1s ease-in-out infinite; }
  .status.done { color: var(--amber); }
  .status.done .lamp { background: var(--amber); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* Línea temporal */
  .timeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 0; }
  .stop { appearance: none; background: none; border: 0; border-top: 1px solid var(--line); color: var(--dim);
          font: inherit; text-align: left; padding: 14px 10px 6px 0; cursor: pointer; position: relative; min-width: 0; }
  .stop::before { content: ""; position: absolute; top: -5px; left: 0; width: 9px; height: 9px; border-radius: 50%;
                  background: var(--void); border: 1px solid var(--dim); }
  .stop .year { display: block; font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg); }
  .stop .name { display: block; font-size: var(--fs-sm); }
  .stop .seen { font-size: var(--fs-xs); color: var(--signal); letter-spacing: 0.08em; }
  .stop:hover .year { color: var(--amber); }
  .stop[aria-pressed="true"] { border-top-color: var(--amber); }
  .stop[aria-pressed="true"]::before { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 12px var(--amber); }
  .stop[aria-pressed="true"] .year, .stop[aria-pressed="true"] .name { color: var(--amber); }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }

  /* Cuerpo */
  .deck { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 760px) { .deck { grid-template-columns: minmax(0, 1fr); } }

  .viewer { border: 1px solid var(--line); background: #000; position: relative; overflow: hidden; }
  .viewer canvas { display: block; width: 100%; max-width: 100%; height: auto; }
  .viewer .hud { position: absolute; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px;
                 font-size: var(--fs-xs); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg);
                 text-shadow: 0 0 4px #000, 0 0 2px #000; font-variant-numeric: tabular-nums; pointer-events: none; }
  .viewer .hud.top { top: 8px; } .viewer .hud.bottom { bottom: 8px; }
  .scan { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: var(--signal);
          box-shadow: 0 0 14px 3px var(--signal); pointer-events: none; }
  .caption { margin: 8px 0 0; font-size: var(--fs-xs); color: var(--dim); }

  .side { display: grid; gap: 18px; min-width: 0; }
  .panel { border: 1px solid var(--line); background: var(--panel); padding: 14px 16px; min-width: 0; }
  .panel > .label { display: block; margin-bottom: 10px; }
  .telemetry { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: var(--fs-sm); }
  .telemetry dt { color: var(--dim); }
  .telemetry dd { margin: 0; overflow-wrap: anywhere; }

  .tune { appearance: none; width: 100%; font: inherit; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
          padding: 14px 12px; cursor: pointer; color: var(--void); background: var(--amber); border: 1px solid var(--amber); }
  .tune:hover { box-shadow: 0 0 22px var(--amber-soft), 0 0 0 3px var(--amber-soft); }
  .tune.stop-btn { background: transparent; color: var(--signal); border-color: var(--signal); }
  .tune:disabled { opacity: 0.6; cursor: progress; }
  .bars { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; height: 64px; align-items: end;
          margin-top: 14px; border-bottom: 1px solid var(--line); }
  .bar { background: var(--line); min-height: 2px; }
  .bar.played { background: var(--amber); }
  .bar.now { background: var(--signal); box-shadow: 0 0 10px var(--signal); }
  .readout { margin: 8px 0 0; font-size: var(--fs-xs); color: var(--dim); font-variant-numeric: tabular-nums; min-height: 1.5em; }
  .readout b { color: var(--signal); font-weight: 500; }
  .error { color: var(--alert); font-size: var(--fs-sm); margin: 10px 0 0; }

  /* Bitácora */
  .log { border: 1px solid var(--line); background: var(--panel); padding: 16px 18px; }
  .log.open { border-color: var(--amber); box-shadow: inset 0 0 40px var(--amber-soft); }
  .log header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin-bottom: 10px; }
  .log p { margin: 0; max-width: 68ch; }
  .log .locked { color: var(--dim); }
  .log .science::after { content: "▌"; color: var(--amber); animation: pulse 0.9s steps(1) infinite; }
  .log .science.complete::after { content: ""; }
  .log .poem { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); color: var(--amber); font-style: italic; }
  .log h3:first-child { margin-top: 0; }
  @keyframes rise { from { opacity: 0.2; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<script>
(function () {

  const N_STEPS = 24;                            // columnas de la imagen que se convierten en notas

  /* ───────────── 1. Misiones ─────────────

      scale: ["E3", "B3", "E4", "F#4", "G#4", "A#4", "B4", "D#5", "E5"], drone: "E2", osc: "fmsine", attack: 0.08, step: 0.46,

    },

      shot: "Ozono total sobre el hemisferio sur en 1979, medido por TOMS. Los azules marcan menos ozono, sobre la Antártida.", credit: "NASA / NOAA",
      telemetry: [["Lanzamiento", "24 oct 1978"], ["Órbita", "≈ 955 km, heliosíncrona"],
                  ["Instrumentos", "TOMS (ozono), SMMR (hielo marino), CZCS (color del océano)"], ["Operación", "1978 – 1994"]],

  };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const EMPTY_STEPS = Array.from({ length: N_STEPS }, () => ({ v: 0, rest: true, note: "" }));

  /* ───────────── 3. Sonificación: de columnas de píxeles a notas ─────────────
     La imagen se divide en 24 franjas verticales. El brillo medio de cada franja
     elige un grado de la escala de la misión; las franjas más oscuras son silencios. */
  function sampleColumns(px, w, h, scale) {
    const lum = [], mx = Math.round(w * 0.03), my = Math.round(h * 0.03), iw = w - 2 * mx;   // ignora el marco del escaneo
    for (let s = 0; s < N_STEPS; s++) {
      const x0 = mx + Math.floor((s / N_STEPS) * iw), x1 = Math.max(x0 + 1, mx + Math.floor(((s + 1) / N_STEPS) * iw));
      let sum = 0, n = 0;
      for (let x = x0; x < x1; x++) for (let y = my; y < h - my; y++) {
        const i = (y * w + x) * 4;
        sum += 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]; n++;
      }
      lum.push(sum / n);
    }
    const lo = Math.min(...lum), hi = Math.max(...lum), span = hi - lo || 1;
    return lum.map((l) => {
      const v = (l - lo) / span;
      return { v, rest: v < 0.08, note: scale[Math.round(v * (scale.length - 1))] };
    });
  }

  /* ───────────── 4. Progreso guardado y descripción de la melodía ───────────── */
  const store = {                                        // localStorage puede fallar o venir vacío: nunca rompe la página
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // Resume en palabras la melodía que sale de la imagen, para la lectura accesible.
  function describeMelody(steps, m) {
    const notes = steps.filter((s) => !s.rest).length;
    if (!notes) return "";
    let hi = 0, lo = -1;
    steps.forEach((s, i) => {
      if (s.v > steps[hi].v) hi = i;
      if (!s.rest && (lo < 0 || s.v < steps[lo].v)) lo = i;
    });
    const where = (i) => (i < 8 ? "al principio" : i < 16 ? "hacia la mitad" : "al final");
    return "El recorrido dura unos " + Math.round(N_STEPS * m.step) + " segundos. Suenan " + notes + " notas y " +
      (N_STEPS - notes) + " silencios. La nota más aguda, " + steps[hi].note + ", llega " + where(hi) + " (franja " + (hi + 1) +
      "); la más grave, " + steps[lo].note + ", " + where(lo) + " (franja " + (lo + 1) + ").";
  }

  /* ───────────── 5. Componentes ───────────── */
  const LOCK = html`<svg viewBox="0 0 12 14" width="11" height="13" aria-hidden="true">
    <rect x="1" y="6" width="10" height="7" fill="currentColor"></rect>
    <path d="M3 6V4a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" strokeWidth="1.5"></path>
  </svg>`;

  function Typewriter({ text, instant, onDone }) {
    const reduced = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const [n, setN] = useState(instant || reduced ? text.length : 0);
    useEffect(() => {
      if (n >= text.length) { onDone(); return; }
      const t = setTimeout(() => setN((k) => Math.min(text.length, k + 2)), 22);
      return () => clearTimeout(t);
    }, [n, text]);
    return html`<p className=${"science" + (n >= text.length ? " complete" : "")} aria-label=${text}>${text.slice(0, n)}</p>`;
  }

  function App() {
    const last = MISSIONS.length - 1;
    // `done` = cuántas misiones se han descifrado, en orden. La misión i está desbloqueada si i <= done.
    const [done, setDone] = useState(() => clamp(Number(store.get("jukebox.done", 0)) || 0, 0, MISSIONS.length));
    const [idx, setIdx] = useState(() => Math.min(done, last));
    const [phase, setPhase] = useState("idle");          // idle | loading | playing | done
    const [step, setStep] = useState(-1);
    const [pct, setPct] = useState(0);
    const [fresh, setFresh] = useState(false);           // la entrada se acaba de descifrar: se escribe letra a letra
    const [more, setMore] = useState(false);             // el resto de la entrada, tras la máquina de escribir
    const [unlocked, setUnlocked] = useState(null);      // índice recién desbloqueado, "all" al completar el archivo
    const [a11y, setA11y] = useState(() => !!store.get("jukebox.a11y", false));
    const [error, setError] = useState("");
    const [steps, setSteps] = useState(EMPTY_STEPS);
    const canvasRef = useRef(null), scanRef = useRef(null);
    const fx = useRef(null);                             // reverb + delay, se crean una vez
    const run = useRef({ id: 0, timer: 0, nodes: [] });

    const m = MISSIONS[idx];
    useEffect(() => store.set("jukebox.done", done), [done]);
    useEffect(() => store.set("jukebox.a11y", a11y), [a11y]);

    useEffect(() => {                                    // carga la imagen, la dibuja y lee sus píxeles
      let alive = true;
      const img = new Image();
      img.onload = () => {
        if (!alive) return;
        const c = canvasRef.current; c.width = img.naturalWidth; c.height = img.naturalHeight;
        const ctx = c.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        try { setSteps(sampleColumns(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, m.scale)); }
        catch (e) { setError("No se pudieron leer los píxeles de la imagen."); }
      };
      img.onerror = () => { if (alive) setError("No se pudo cargar la imagen de " + m.name + "."); };
      img.src = IMAGES[m.id];
      return () => { alive = false; };
    }, [m]);

    const silence = useCallback((tail) => {
      const r = run.current; r.id++; clearInterval(r.timer);
      const nodes = r.nodes; r.nodes = [];
      const kill = () => nodes.forEach((nd) => { try { nd.dispose(); } catch (e) {} });
      if (tail) setTimeout(kill, tail * 1000); else kill();
    }, []);

    const resetView = () => { setPhase("idle"); setStep(-1); setPct(0); setFresh(false); setMore(false); setUnlocked(null); setError(""); };

    const select = (i) => {
      if (i > done) {                                    // no se salta al futuro sin investigar el pasado
        setError("La señal de " + MISSIONS[i].year + " sigue bloqueada. Completa primero la sonificación de " + MISSIONS[done].name + ".");
        return;
      }
      if (i === idx) return;
      silence(0); setIdx(i); resetView();
    };

    const restart = () => { silence(0); setDone(0); setIdx(0); resetView(); };

    // Campanada de éxito: tónica, quinta y octava sobre la nota grave de la misión.
    const chime = (mission) => {
      const bell = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sine" }, envelope: { attack: 0.005, decay: 0.7, sustain: 0, release: 1.6 }
      }).connect(fx.current.reverb);
      bell.volume.value = -9;
      const root = Tone.Frequency(mission.drone), now = Tone.now();
      [36, 43, 48].forEach((semi, i) => bell.triggerAttackRelease(root.transpose(semi).toNote(), 0.6, now + i * 0.14));
      setTimeout(() => { try { bell.dispose(); } catch (e) {} }, 6000);
    };

    const tune = async () => {
      if (phase === "playing" || phase === "loading") { silence(0); setPhase("idle"); setStep(-1); setPct(0); return; }
      if (!window.Tone) { setError("No se pudo cargar Tone.js. Revisa la conexión y recarga la página."); return; }
      setError(""); setStep(-1); setPct(0); setUnlocked(null); setPhase("loading");
      const myRun = ++run.current.id;
      try {
        await Tone.start();                               // el audio solo arranca tras un gesto del usuario
        if (!fx.current) {
          const reverb = new Tone.Reverb({ decay: 7, preDelay: 0.05, wet: 0.55 }).toDestination();
          await reverb.ready;
          const delay = new Tone.FeedbackDelay({ delayTime: 0.45, feedback: 0.38, wet: 0.28 }).connect(reverb);
          fx.current = { reverb, delay };
        }
      } catch (e) { setPhase("idle"); setError("El navegador bloqueó el audio. Vuelve a pulsar el botón."); return; }
      if (myRun !== run.current.id) return;               // cambió la misión mientras cargaba

      const synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: m.osc },
        envelope: { attack: m.attack, decay: 0.5, sustain: 0.25, release: 2.8 }
      }).connect(fx.current.delay);
      synth.volume.value = -13;
      const drone = new Tone.Synth({
        oscillator: { type: "sine" }, envelope: { attack: 2, decay: 0, sustain: 1, release: 4 }
      }).connect(fx.current.reverb);
      drone.volume.value = -19;
      run.current.nodes = [synth, drone];

      const t0 = Tone.now() + 0.15, total = N_STEPS * m.step;
      drone.triggerAttackRelease(m.drone, total, t0);
      steps.forEach((s, i) => {
        if (!s.rest) synth.triggerAttackRelease(s.note, m.step * 2.2, t0 + i * m.step, 0.3 + 0.6 * s.v);
      });
      setPhase("playing");

      const tick = () => {
        if (myRun !== run.current.id) return;
        const el = Tone.now() - t0, p = clamp(el / total);
        if (scanRef.current) scanRef.current.style.left = (p * 100) + "%";
        setStep(Math.min(N_STEPS - 1, Math.floor(p * N_STEPS)));
        setPct(Math.round(p * 100));
        if (el >= total + 1.2) {                          // barra al 100 % y cola de la última nota: misión descifrada
          silence(6);                                     // deja morir la reverberación antes de liberar los sintes
          chime(m);
          setPhase("done"); setStep(N_STEPS); setPct(100);
          if (idx >= done) {                              // primera vez: desbloquea el siguiente año
            setFresh(true); setMore(false);
            setDone(idx + 1);
            setUnlocked(idx < last ? idx + 1 : "all");
          }
        }
      };
      run.current.timer = setInterval(tick, 40);          // temporizador, no rAF: sigue avanzando con la pestaña en segundo plano
    };

    const live = phase === "playing";
    const revealed = idx < done;                          // la entrada de bitácora ya está descifrada
    const cur = live && step >= 0 && step < N_STEPS ? steps[step] : null;
    const statusText = { idle: "Señal en espera", loading: "Calentando receptor", playing: "Sintonizando espectro", done: "Registro descifrado" }[phase];
    const btnText = { idle: "Sintonizar espectro", loading: "Calentando receptor…", playing: "Cortar señal", done: "Volver a sintonizar" }[phase];

    return html`
      <main className=${"console" + (a11y ? " a11y" : "")}>
        <header className="head">
          <div>
            <h1>jukebox terrestre</h1>
            <p>Terminal de sonificación · Centro de Información de la Tierra</p>
          </div>
          <div className="head-tools">
            <button id="a11y-toggle" className="ghost" aria-pressed=${a11y} onClick=${() => setA11y(!a11y)}>
              Lectura accesible: ${a11y ? "activada" : "desactivada"}
            </button>
            <div className=${"status" + (live || phase === "loading" ? " live" : phase === "done" ? " done" : "")} role="status">
              <span className="lamp"></span>${statusText}
            </div>
          </div>
        </header>

        <nav className="timeline" aria-label="Línea temporal de misiones">
          ${MISSIONS.map((ms, i) => {
            const locked = i > done;
            const label = locked
              ? ms.year + ", misión bloqueada. Completa la sonificación de " + MISSIONS[i - 1].name + " para desbloquearla."
              : ms.year + ", " + ms.name + (i < done ? ", descifrada" : ", por sintonizar");
            return html`
              <button key=${ms.id} id=${"stop-" + ms.id} className=${"stop" + (unlocked === i ? " fresh" : "")}
                      aria-pressed=${i === idx} aria-disabled=${locked} aria-label=${label} onClick=${() => select(i)}>
                <span className="year">${ms.year}</span>
                <span className="name">${locked ? "señal sin identificar" : ms.name}</span>
                ${locked
                  ? html`<span className="seen lock">${LOCK}<span>bloqueada</span></span>`
                  : html`<span className="seen">${i < done ? "● descifrado" : "○ por sintonizar"}</span>`}
              </button>`;
          })}
        </nav>

        ${a11y && html`
          <section className="panel access" aria-labelledby="access-title">
            <h2 id="access-title" className="label">Lectura accesible · ${m.name}, ${m.year}</h2>
            <h3>Lo que muestra la imagen</h3>
            <p>${m.seeing}</p>
            <h3>Lo que suena</h3>
            <p>${m.hearing}</p>
            <p>${describeMelody(steps, m)}</p>
            <h3>Cómo funciona</h3>
            <p>El botón «Sintonizar espectro» recorre la imagen de izquierda a derecha en 24 franjas. Cuanto más brillante es una franja, más aguda es su nota; las franjas más oscuras son silencios. Al terminar suena una campanada de tres notas ascendentes, se abre la bitácora de la misión y se desbloquea el siguiente año de la línea temporal.</p>
          </section>`}

        <section className="deck">
          <div>
            <div className="viewer">
              <canvas ref=${canvasRef} role="img" aria-label=${m.shot}></canvas>
              <div className="hud top"><span>${m.name} · ${m.year}</span><span>${m.instrument}</span></div>
              <div className="hud bottom">
                <span>${m.date}</span>
                <span>${live ? "franja " + String(Math.min(step + 1, N_STEPS)).padStart(2, "0") + "/" + N_STEPS : "barrido detenido"}</span>
              </div>
              <div className="scan" ref=${scanRef} hidden=${!live}></div>
            </div>
            <p className="caption">${m.shot} Imagen: ${m.credit}, dominio público.</p>
          </div>

          <div className="side">
            <div className="panel">
              <h2 className="label">Telemetría de la misión</h2>
              <dl className="telemetry">
                ${m.telemetry.map(([k, v]) => html`<${React.Fragment} key=${k}><dt>${k}</dt><dd>${v}</dd><//>`)}
              </dl>
            </div>

            <div className="panel">
              <h2 className="label">Jukebox · sonificación de datos</h2>
              <button id="tune" className=${"tune" + (live ? " stop-btn" : "")} onClick=${tune} disabled=${phase === "loading"}>${btnText}</button>
              <div className="progress" role="progressbar" aria-label="Progreso de la sonificación"
                   aria-valuemin="0" aria-valuemax="100" aria-valuenow=${pct}>
                <div style=${{ width: pct + "%" }}></div>
              </div>
              <div className="bars" aria-hidden="true">
                ${steps.map((s, i) => html`<div key=${i}
                  className=${"bar" + (live && i === step ? " now" : i < step || phase === "done" ? " played" : "")}
                  style=${{ height: s.rest ? "2px" : (12 + s.v * 88) + "%" }}></div>`)}
              </div>
              <p className="readout" aria-hidden="true">
                ${cur ? html`<span>${pct}% · franja ${step + 1} → <b>${cur.rest ? "silencio" : cur.note}</b> · brillo ${Math.round(cur.v * 100)}%</span>`
                      : html`<span>${pct}% · 24 franjas de la imagen · escala ${m.scale[0]} – ${m.scale[m.scale.length - 1]}</span>`}
              </p>
              ${error && html`<p className="error" role="alert">${error}</p>`}
            </div>
          </div>
        </section>

        <div className=${unlocked !== null ? "unlock" : ""} role="status">
          ${unlocked === "all" && html`<span>Archivo completo. Recorriste 55 años de observación de la Tierra, de 1960 a 2015.</span>`}
          ${typeof unlocked === "number" && html`<span>Señal nueva en la línea temporal: <b>${MISSIONS[unlocked].year} · ${MISSIONS[unlocked].name}</b></span>`}
          ${typeof unlocked === "number" && html`<button id="travel" className="ghost" onClick=${() => select(unlocked)}>Viajar a ${MISSIONS[unlocked].year}</button>`}
        </div>

        <section className=${"log" + (revealed ? " open" : "")} aria-labelledby="log-title">
          <header>
            <h2 id="log-title" className="label">Bitácora de a bordo · entrada ${String(idx + 1).padStart(2, "0")}/${String(MISSIONS.length).padStart(2, "0")}</h2>
            <span className="label">Registros descifrados ${done}/${MISSIONS.length}</span>
          </header>
          ${revealed
            ? html`<div key=${m.id + (fresh ? "-fresh" : "")}>
                <h3>Registro científico</h3>
                <${Typewriter} text=${m.science} instant=${!fresh || a11y} onDone=${() => setMore(true)} />
                ${(more || !fresh) && html`<div className=${fresh ? "reveal" : ""}>
                  <h3>Impacto en el planeta</h3>
                  <p>${m.impact}</p>
                  <p className="poem">${m.poem}</p>
                </div>`}
              </div>`
            : html`<p className="locked">▒▒▒▒▒ Registro cifrado. Sintoniza el espectro de ${m.name} hasta el 100 % para leerlo y desbloquear ${idx < last ? "la señal de " + MISSIONS[idx + 1].year : "el archivo completo"}.</p>`}
        </section>

        <footer className="foot">
          <span>Imágenes: archivo de NASA, dominio público.</span>
          <button id="restart" className="ghost" onClick=${restart}>Reiniciar exploración</button>
        </footer>
      </main>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
