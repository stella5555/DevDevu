<title>Jukebox Terrestre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Major+Mono+Display&display=swap">
<style>
  /* Layout: consola de una sola pantalla. Línea temporal arriba, visor de imagen a la izquierda,
     telemetría + jukebox a la derecha, bitácora abajo. Un solo mundo visual oscuro, por decisión. */
  :root {
    color-scheme: dark;
    --void: #080b10;        /* fondo: negro con sesgo azul */
    --panel: #0e131b;       /* superficie de panel */
    --line: #253041;        /* bordes y retícula */
    --fg: #e9dfc9;          /* texto: blanco cálido */
    --dim: #8b93a1;         /* texto secundario */
    --amber: #f0a63c;       /* acento principal: fogata / fósforo ámbar */
    --amber-soft: rgba(240, 166, 60, 0.14);
    --signal: #7be0a4;      /* señal viva: verde terminal */
    --alert: #ef7b6a;
    --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    --font-display: "Major Mono Display", "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --fs-xs: 0.72rem; --fs-sm: 0.82rem; --fs-md: 0.95rem; --fs-xl: clamp(1.25rem, 3.4vw, 1.9rem);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--void);
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: var(--fs-md);
    line-height: 1.55;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .console { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; }

  .label { font-size: var(--fs-xs); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }

  /* Cabecera */
  .head { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; justify-content: space-between;
          border-bottom: 1px solid var(--line); padding-bottom: 14px; }
  .head h1 { font-family: var(--font-display); font-weight: 400; font-size: var(--fs-xl); margin: 0;
             color: var(--amber); letter-spacing: 0.04em; text-wrap: balance; }
  .head p { margin: 2px 0 0; color: var(--dim); font-size: var(--fs-sm); }
  .status { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--dim); }
  .status .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .status.live { color: var(--signal); }
  .status.live .lamp { background: var(--signal); box-shadow: 0 0 10px var(--signal); animation: pulse 1.1s ease-in-out infinite; }
  .status.done { color: var(--amber); }
  .status.done .lamp { background: var(--amber); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  /* Línea temporal */
  .timeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 0; }
  .stop { appearance: none; background: none; border: 0; border-top: 1px solid var(--line); color: var(--dim);
          font: inherit; text-align: left; padding: 14px 10px 6px 0; cursor: pointer; position: relative; min-width: 0; }
  .stop::before { content: ""; position: absolute; top: -5px; left: 0; width: 9px; height: 9px; border-radius: 50%;
                  background: var(--void); border: 1px solid var(--dim); }
  .stop .year { display: block; font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg); }
  .stop .name { display: block; font-size: var(--fs-sm); }
  .stop .seen { font-size: var(--fs-xs); color: var(--signal); letter-spacing: 0.08em; }
  .stop:hover .year { color: var(--amber); }
  .stop[aria-pressed="true"] { border-top-color: var(--amber); }
  .stop[aria-pressed="true"]::before { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 12px var(--amber); }
  .stop[aria-pressed="true"] .year, .stop[aria-pressed="true"] .name { color: var(--amber); }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }

  /* Cuerpo */
  .deck { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 760px) { .deck { grid-template-columns: minmax(0, 1fr); } }

  .viewer { border: 1px solid var(--line); background: #000; position: relative; overflow: hidden; }
  .viewer canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; }
  .viewer .hud { position: absolute; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px;
                 font-size: var(--fs-xs); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg);
                 text-shadow: 0 0 4px #000, 0 0 2px #000; font-variant-numeric: tabular-nums; pointer-events: none; }
  .viewer .hud.top { top: 8px; } .viewer .hud.bottom { bottom: 8px; }
  .scan { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: var(--signal);
          box-shadow: 0 0 14px 3px var(--signal); pointer-events: none; }
  .caption { margin: 8px 0 0; font-size: var(--fs-xs); color: var(--dim); }

  .side { display: grid; gap: 18px; min-width: 0; }
  .panel { border: 1px solid var(--line); background: var(--panel); padding: 14px 16px; min-width: 0; }
  .panel > .label { display: block; margin-bottom: 10px; }
  .telemetry { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: var(--fs-sm); }
  .telemetry dt { color: var(--dim); }
  .telemetry dd { margin: 0; overflow-wrap: anywhere; }

  .tune { appearance: none; width: 100%; font: inherit; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
          padding: 14px 12px; cursor: pointer; color: var(--void); background: var(--amber); border: 1px solid var(--amber); }
  .tune:hover { box-shadow: 0 0 22px var(--amber-soft), 0 0 0 3px var(--amber-soft); }
  .tune.stop-btn { background: transparent; color: var(--signal); border-color: var(--signal); }
  .tune:disabled { opacity: 0.6; cursor: progress; }
  .bars { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; height: 64px; align-items: end;
          margin-top: 14px; border-bottom: 1px solid var(--line); }
  .bar { background: var(--line); min-height: 2px; }
  .bar.played { background: var(--amber); }
  .bar.now { background: var(--signal); box-shadow: 0 0 10px var(--signal); }
  .readout { margin: 8px 0 0; font-size: var(--fs-xs); color: var(--dim); font-variant-numeric: tabular-nums; min-height: 1.5em; }
  .readout b { color: var(--signal); font-weight: 500; }
  .error { color: var(--alert); font-size: var(--fs-sm); margin: 10px 0 0; }

  /* Bitácora */
  .log { border: 1px solid var(--line); background: var(--panel); padding: 16px 18px; }
  .log.open { border-color: var(--amber); box-shadow: inset 0 0 40px var(--amber-soft); }
  .log header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin-bottom: 10px; }
  .log p { margin: 0; max-width: 68ch; }
  .log .locked { color: var(--dim); }
  .log .science::after { content: "▌"; color: var(--amber); animation: pulse 0.9s steps(1) infinite; }
  .log .science.complete::after { content: ""; }
  .log .poem { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); color: var(--amber); font-style: italic;
               animation: rise 1.2s ease-out; }
  @keyframes rise { from { opacity: 0.2; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
(function () {
  const { useState, useEffect, useRef, useMemo, useCallback } = React;
  const html = htm.bind(React.createElement);   // JSX sin compilador: html`<div>…</div>`
  const N_STEPS = 24;                            // columnas de la imagen que se convierten en notas

  /* ───────────── 1. Misiones ─────────────
     Para usar imágenes reales del EIC: sustituye `style` por una URL de imagen,
     dibújala en el canvas y deja que sampleColumns() la lea igual. */
  const MISSIONS = [
    {
      id: "tiros1", year: 1960, name: "TIROS-1", instrument: "Cámara vidicón de TV", style: "vidicon",
      w: 80, h: 60, seed: 1960,
      telemetry: [["Lanzamiento", "1 abr 1960"], ["Órbita", "≈ 700 km, 48° de inclinación"],
                  ["Instrumento", "2 cámaras vidicón (gran angular y estrecha)"], ["Operación", "78 días · 22 952 imágenes"]],
      scale: ["D3", "A3", "C4", "D4", "F4", "A4", "C5", "D5"], drone: "D2", osc: "triangle", attack: 0.02, step: 0.5,
      science: "TIROS-1 fue el primer satélite meteorológico que funcionó. Durante 78 días sus dos cámaras de televisión transmitieron 22 952 imágenes y mostraron, por primera vez, que las nubes se organizan en sistemas de escala planetaria que solo se ven enteros desde la órbita.",
      poem: "La Tierra se miró desde fuera por primera vez y lo que vio fue movimiento. Ningún cielo se repite dos veces."
    },
    {
      id: "landsat1", year: 1972, name: "Landsat 1", instrument: "MSS · falso color", style: "falsecolor",
      w: 128, h: 96, seed: 1972,
      telemetry: [["Lanzamiento", "23 jul 1972 (como ERTS-1)"], ["Órbita", "≈ 917 km, heliosíncrona"],
                  ["Instrumento", "Escáner multiespectral MSS, 4 bandas"], ["Resolución", "≈ 80 m por píxel"], ["Operación", "1972 – 1978"]],
      scale: ["E3", "B3", "E4", "F#4", "G#4", "A#4", "B4", "D#5", "E5"], drone: "E2", osc: "fmsine", attack: 0.08, step: 0.46,
      science: "El escáner multiespectral de Landsat 1 registraba cuatro bandas, del verde al infrarrojo cercano, con píxeles de unos 80 m. En falso color la vegetación sana aparece roja porque refleja con fuerza el infrarrojo. Con él empezó el registro continuo de la superficie terrestre más largo que existe.",
      poem: "Desde entonces cada bosque tiene memoria. Lo que se tala, lo que se quema y lo que vuelve a crecer queda escrito en rojo."
    },
    {
      id: "nimbus7", year: 1978, name: "Nimbus-7", instrument: "TOMS · ozono total", style: "ozone",
      w: 96, h: 72, seed: 1978,
      telemetry: [["Lanzamiento", "24 oct 1978"], ["Órbita", "≈ 955 km, heliosíncrona"],
                  ["Instrumentos", "TOMS (ozono), SMMR (hielo marino), CZCS (color del océano)"], ["Operación", "1978 – 1994"]],
      scale: ["C3", "G3", "D4", "E4", "F#4", "G#4", "A#4", "D5"], drone: "C2", osc: "amsine", attack: 0.25, step: 0.56,
      science: "El espectrómetro TOMS de Nimbus-7 cartografió el ozono total del planeta día tras día. Sus datos confirmaron en 1985 la extensión del agujero de ozono sobre la Antártida. Otro de sus instrumentos, el radiómetro SMMR, inició el registro satelital continuo del hielo marino.",
      poem: "Vimos una herida en el cielo y decidimos cerrarla. Sigue sanando, despacio, porque alguien la midió a tiempo."
    },
    {
      id: "terra", year: 1999, name: "Terra", instrument: "MODIS · color verdadero", style: "truecolor",
      w: 160, h: 120, seed: 1999,
      telemetry: [["Lanzamiento", "18 dic 1999"], ["Órbita", "705 km, heliosíncrona"],
                  ["Instrumentos", "MODIS, ASTER, CERES, MISR, MOPITT"], ["Resolución", "MODIS: 250 m a 1 km, 36 bandas"]],
      scale: ["A2", "E3", "A3", "B3", "C4", "E4", "F#4", "G4", "B4", "E5"], drone: "A1", osc: "fattriangle", attack: 0.12, step: 0.42,
      science: "Terra lleva cinco instrumentos que observan a la vez tierra, océano y atmósfera. MODIS cubre casi toda la superficie cada uno o dos días en 36 bandas espectrales, y de ahí salen los mapas diarios de incendios, clorofila oceánica, nieve y aerosoles.",
      poem: "El planeta dejó de ser un retrato y se volvió un pulso. Ahora lo escuchamos latir todos los días."
    },
    {
      id: "dscovr", year: 2015, name: "DSCOVR", instrument: "EPIC · disco completo", style: "disk",
      w: 160, h: 120, seed: 2015,
      telemetry: [["Lanzamiento", "11 feb 2015"], ["Posición", "Punto de Lagrange L1, a 1,5 millones de km"],
                  ["Instrumento", "Cámara EPIC, 10 bandas (UV a infrarrojo cercano)"], ["Imagen", "2048 × 2048 px, cara iluminada completa"]],
      scale: ["G2", "D3", "G3", "A3", "D4", "E4", "B4", "D5", "A5"], drone: "G1", osc: "sine", attack: 0.4, step: 0.62,
      science: "DSCOVR orbita el punto de Lagrange L1, a millón y medio de kilómetros, siempre entre la Tierra y el Sol. Su cámara EPIC fotografía varias veces al día el disco completo iluminado en diez bandas, del ultravioleta al infrarrojo cercano.",
      poem: "Desde aquí cabe entera en una sola mirada. Todo lo que cambia, cambia en el mismo lugar: el único que tenemos."
    }
  ];

  /* ───────────── 2. Imagen satelital procedimental ───────────── */
  function rng(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeNoise(seed) {
    const S = 64, r = rng(seed), g = new Float32Array(S * S);
    for (let i = 0; i < g.length; i++) g[i] = r();
    const at = (x, y) => g[(((y % S) + S) % S) * S + (((x % S) + S) % S)];
    const base = (x, y) => {
      const xi = Math.floor(x), yi = Math.floor(y);
      let fx = x - xi, fy = y - yi;
      fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
      return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
    };
    return (x, y, oct = 4) => {
      let amp = 0.5, f = 1, sum = 0, norm = 0;
      for (let o = 0; o < oct; o++) { sum += amp * base(x * f, y * f); norm += amp; amp *= 0.5; f *= 2; }
      return sum / norm;
    };
  }
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const mix = (c1, c2, t) => [c1[0] + (c2[0] - c1[0]) * t, c1[1] + (c2[1] - c1[1]) * t, c1[2] + (c2[2] - c1[2]) * t];
  const OZONE_RAMP = [[70, 20, 110], [50, 60, 190], [40, 150, 170], [110, 200, 90], [235, 215, 70], [240, 130, 50]];
  function ramp(stops, t) {
    const p = clamp(t) * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(p));
    return mix(stops[i], stops[i + 1], p - i);
  }

  function renderMission(m) {
    const { w, h } = m, px = new Uint8ClampedArray(w * h * 4);
    const n1 = makeNoise(m.seed), n2 = makeNoise(m.seed + 7), n3 = makeNoise(m.seed + 13), grain = rng(m.seed + 99);

    const earth = (u, v) => {                       // océano, tierra y nubes en color verdadero
      const e = n1(u * 3, v * 3), c = n2(u * 4 + 7, v * 4 + 3);
      let col;
      if (e < 0.5) { const d = clamp((0.5 - e) * 5); col = mix([44, 104, 160], [10, 34, 84], d); }
      else { const t = clamp((e - 0.5) * 5) * 0.7 + n3(u * 9, v * 9) * 0.6 - 0.25; col = mix([46, 98, 48], [158, 136, 90], clamp(t)); }
      return mix(col, [240, 244, 248], smooth(0.52, 0.68, c));
    };

    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const u = x / w, v = y / h; let col;
      if (m.style === "vidicon") {                  // TV en blanco y negro, limbo terrestre y marcas fiduciales
        const horizon = 0.12 + 0.6 * (u - 0.5) * (u - 0.5);
        let g = 6;
        if (v > horizon) {
          const c = n1(u * 4 + n2(u * 2, v * 2) * 1.5, v * 4);
          g = 26 + 215 * smooth(0.42, 0.66, c);
          g *= smooth(0, 0.1, v - horizon) * 0.6 + 0.4;
        }
        g *= 1 - 0.55 * (Math.pow(u - 0.5, 2) + Math.pow(v - 0.5, 2)) * 2;
        g += (grain() - 0.5) * 38;
        if (y % 2) g *= 0.86;
        const cx = x % 20, cy = y % 20;
        if ((cx === 10 && Math.abs(cy - 10) <= 1) || (cy === 10 && Math.abs(cx - 10) <= 1)) g = 8;
        col = [g, g, g * 0.98];
      } else if (m.style === "falsecolor") {        // MSS: vegetación roja, agua casi negra, suelo desnudo cian
        const e = n1(u * 3, v * 3), river = Math.abs(n2(u * 2, v * 2) - 0.5);
        if (e < 0.43 || river < 0.012) col = mix([8, 14, 40], [20, 44, 90], clamp((e - 0.3) * 6));
        else {
          const veg = n3(u * 7, v * 7);
          const plot = rng(Math.floor(u * 26) * 131 + Math.floor(v * 20) * 17 + m.seed)();   // parcelas agrícolas
          const k = clamp((veg - 0.4) * 4 + (plot - 0.5) * 0.5);
          col = mix([128, 176, 182], [214, 36, 58], k);
          col = mix(col, [70, 20, 30], clamp((e - 0.62) * 5));
        }
      } else if (m.style === "ozone") {             // TOMS: proyección polar con el agujero de ozono
        const dx = (u - 0.5) * (w / h), dy = v - 0.5, r = Math.sqrt(dx * dx + dy * dy) / 0.46;
        if (r > 1) col = [10, 13, 20];
        else {
          const wob = n1(u * 3, v * 3) - 0.5;
          const hx = dx + 0.04 + wob * 0.12, hy = dy - 0.02 + wob * 0.1;
          const hole = Math.exp(-(hx * hx + hy * hy) / 0.022);
          const val = 0.62 + 0.32 * Math.sin(r * 3.1) * 0.6 - 0.7 * hole + (n2(u * 5, v * 5) - 0.5) * 0.5;
          col = ramp(OZONE_RAMP, val);
          if (Math.abs(r - 0.36) < 0.012 || Math.abs(r - 0.7) < 0.012 || Math.abs(dx) < 0.004 || Math.abs(dy) < 0.004) col = mix(col, [10, 13, 20], 0.5);
        }
      } else if (m.style === "truecolor") {
        col = earth(u, v);
      } else {                                      // EPIC: disco completo sobre el vacío
        const dx = (u - 0.5) * (w / h), dy = v - 0.5, R = 0.44, r = Math.sqrt(dx * dx + dy * dy) / R;
        if (r > 1) { const s = grain(); col = s > 0.994 ? [200, 200, 210] : [2, 3, 6]; }
        else {
          const nz = Math.sqrt(1 - r * r);
          col = earth(0.5 + (dx / R) / (nz + 0.7) * 0.5, 0.5 + (dy / R) / (nz + 0.7) * 0.5);
          const shade = 0.3 + 0.7 * Math.pow(nz, 0.55);
          col = mix([col[0] * shade, col[1] * shade, col[2] * shade], [110, 170, 255], smooth(0.86, 1, r) * 0.55);
        }
      }
      const i = (y * w + x) * 4;
      px[i] = col[0]; px[i + 1] = col[1]; px[i + 2] = col[2]; px[i + 3] = 255;
    }
    return px;
  }

  /* ───────────── 3. Sonificación: de columnas de píxeles a notas ─────────────
     La imagen se divide en 24 franjas verticales. El brillo medio de cada franja
     elige un grado de la escala de la misión; las franjas más oscuras son silencios. */
  function sampleColumns(px, w, h, scale) {
    const lum = [];
    for (let s = 0; s < N_STEPS; s++) {
      const x0 = Math.floor((s / N_STEPS) * w), x1 = Math.max(x0 + 1, Math.floor(((s + 1) / N_STEPS) * w));
      let sum = 0, n = 0;
      for (let x = x0; x < x1; x++) for (let y = 0; y < h; y++) {
        const i = (y * w + x) * 4;
        sum += 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]; n++;
      }
      lum.push(sum / n);
    }
    const lo = Math.min(...lum), hi = Math.max(...lum), span = hi - lo || 1;
    return lum.map((l) => {
      const v = (l - lo) / span;
      return { v, rest: v < 0.08, note: scale[Math.round(v * (scale.length - 1))] };
    });
  }

  /* ───────────── 4. Componentes ───────────── */
  function Typewriter({ text, onDone }) {
    const reduced = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
    const [n, setN] = useState(reduced ? text.length : 0);
    useEffect(() => {
      if (n >= text.length) { onDone(); return; }
      const t = setTimeout(() => setN((k) => Math.min(text.length, k + 2)), 22);
      return () => clearTimeout(t);
    }, [n, text]);
    return html`<p className=${"science" + (n >= text.length ? " complete" : "")} aria-label=${text}>${text.slice(0, n)}</p>`;
  }

  function App() {
    const [idx, setIdx] = useState(0);
    const [phase, setPhase] = useState("idle");          // idle | loading | playing | done
    const [step, setStep] = useState(-1);
    const [poem, setPoem] = useState(false);
    const [seen, setSeen] = useState(() => new Set());
    const [error, setError] = useState("");
    const canvasRef = useRef(null), scanRef = useRef(null);
    const fx = useRef(null);                             // reverb + delay, se crean una vez
    const run = useRef({ id: 0, raf: 0, nodes: [] });

    const m = MISSIONS[idx];
    const pixels = useMemo(() => renderMission(m), [m]);
    const steps = useMemo(() => sampleColumns(pixels, m.w, m.h, m.scale), [pixels, m]);

    useEffect(() => {
      const c = canvasRef.current; c.width = m.w; c.height = m.h;
      c.getContext("2d").putImageData(new ImageData(pixels, m.w, m.h), 0, 0);
    }, [pixels, m]);

    const silence = useCallback((tail) => {
      const r = run.current; r.id++; cancelAnimationFrame(r.raf);
      const nodes = r.nodes; r.nodes = [];
      const kill = () => nodes.forEach((nd) => { try { nd.dispose(); } catch (e) {} });
      if (tail) setTimeout(kill, tail * 1000); else kill();
    }, []);

    const select = (i) => {
      if (i === idx) return;
      silence(0); setIdx(i); setPhase("idle"); setStep(-1); setPoem(false); setError("");
    };

    const tune = async () => {
      if (phase === "playing" || phase === "loading") { silence(0); setPhase("idle"); setStep(-1); return; }
      if (!window.Tone) { setError("No se pudo cargar Tone.js. Revisa la conexión y recarga la página."); return; }
      setError(""); setPoem(false); setStep(-1); setPhase("loading");
      const myRun = ++run.current.id;
      try {
        await Tone.start();                               // el audio solo arranca tras un gesto del usuario
        if (!fx.current) {
          const reverb = new Tone.Reverb({ decay: 7, preDelay: 0.05, wet: 0.55 }).toDestination();
          await reverb.ready;
          const delay = new Tone.FeedbackDelay({ delayTime: 0.45, feedback: 0.38, wet: 0.28 }).connect(reverb);
          fx.current = { reverb, delay };
        }
      } catch (e) { setPhase("idle"); setError("El navegador bloqueó el audio. Vuelve a pulsar el botón."); return; }
      if (myRun !== run.current.id) return;               // cambió la misión mientras cargaba

      const synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: m.osc },
        envelope: { attack: m.attack, decay: 0.5, sustain: 0.25, release: 2.8 }
      }).connect(fx.current.delay);
      synth.volume.value = -13;
      const drone = new Tone.Synth({
        oscillator: { type: "sine" }, envelope: { attack: 2, decay: 0, sustain: 1, release: 4 }
      }).connect(fx.current.reverb);
      drone.volume.value = -19;
      run.current.nodes = [synth, drone];

      const t0 = Tone.now() + 0.15, total = N_STEPS * m.step;
      drone.triggerAttackRelease(m.drone, total, t0);
      steps.forEach((s, i) => {
        if (!s.rest) synth.triggerAttackRelease(s.note, m.step * 2.2, t0 + i * m.step, 0.3 + 0.6 * s.v);
      });
      setPhase("playing");

      const tick = () => {
        if (myRun !== run.current.id) return;
        const el = Tone.now() - t0, p = clamp(el / total);
        if (scanRef.current) scanRef.current.style.left = (p * 100) + "%";
        setStep(Math.min(N_STEPS - 1, Math.floor(p * N_STEPS)));
        if (el >= total + 1.2) {
          silence(6);                                     // deja morir la reverberación antes de liberar los sintes
          setPhase("done"); setStep(N_STEPS);
          setSeen((prev) => new Set(prev).add(m.id));
          return;
        }
        run.current.raf = requestAnimationFrame(tick);
      };
      run.current.raf = requestAnimationFrame(tick);
    };

    const live = phase === "playing";
    const cur = live && step >= 0 && step < N_STEPS ? steps[step] : null;
    const statusText = { idle: "Señal en espera", loading: "Calentando receptor", playing: "Sintonizando espectro", done: "Registro descifrado" }[phase];
    const btnText = { idle: "Sintonizar espectro", loading: "Calentando receptor…", playing: "Cortar señal", done: "Volver a sintonizar" }[phase];

    return html`
      <main className="console">
        <header className="head">
          <div>
            <h1>jukebox terrestre</h1>
            <p>Terminal de sonificación · Centro de Información de la Tierra</p>
          </div>
          <div className=${"status" + (live || phase === "loading" ? " live" : phase === "done" ? " done" : "")} role="status">
            <span className="lamp"></span>${statusText}
          </div>
        </header>

        <nav className="timeline" aria-label="Línea temporal de misiones">
          ${MISSIONS.map((ms, i) => html`
            <button key=${ms.id} id=${"stop-" + ms.id} className="stop" aria-pressed=${i === idx} onClick=${() => select(i)}>
              <span className="year">${ms.year}</span>
              <span className="name">${ms.name}</span>
              <span className="seen">${seen.has(ms.id) ? "● descifrado" : " "}</span>
            </button>`)}
        </nav>

        <section className="deck">
          <div>
            <div className="viewer">
              <canvas ref=${canvasRef} role="img" aria-label=${"Imagen simulada de " + m.name + ", " + m.instrument}></canvas>
              <div className="hud top"><span>${m.name} · ${m.year}</span><span>${m.instrument}</span></div>
              <div className="hud bottom">
                <span>${m.w} × ${m.h} px</span>
                <span>${live ? "franja " + String(Math.min(step + 1, N_STEPS)).padStart(2, "0") + "/" + N_STEPS : "barrido detenido"}</span>
              </div>
              <div className="scan" ref=${scanRef} hidden=${!live}></div>
            </div>
            <p className="caption">Reconstrucción procedimental al estilo del instrumento. No es una imagen real del EIC.</p>
          </div>

          <div className="side">
            <div className="panel">
              <span className="label">Telemetría de la misión</span>
              <dl className="telemetry">
                ${m.telemetry.map(([k, v]) => html`<${React.Fragment} key=${k}><dt>${k}</dt><dd>${v}</dd><//>`)}
              </dl>
            </div>

            <div className="panel">
              <span className="label">Jukebox · sonificación de datos</span>
              <button id="tune" className=${"tune" + (live ? " stop-btn" : "")} onClick=${tune} disabled=${phase === "loading"}>${btnText}</button>
              <div className="bars" aria-hidden="true">
                ${steps.map((s, i) => html`<div key=${i}
                  className=${"bar" + (live && i === step ? " now" : i < step || phase === "done" ? " played" : "")}
                  style=${{ height: s.rest ? "2px" : (12 + s.v * 88) + "%" }}></div>`)}
              </div>
              <p className="readout">
                ${cur ? html`<span>franja ${step + 1} → <b>${cur.rest ? "silencio" : cur.note}</b> · brillo ${Math.round(cur.v * 100)}%</span>`
                      : html`<span>24 franjas de la imagen · escala ${m.scale[0]} – ${m.scale[m.scale.length - 1]}</span>`}
              </p>
              ${error && html`<p className="error" role="alert">${error}</p>`}
            </div>
          </div>
        </section>

        <section className=${"log" + (phase === "done" ? " open" : "")} aria-live="polite">
          <header>
            <span className="label">Bitácora de a bordo · entrada ${String(idx + 1).padStart(2, "0")}/${String(MISSIONS.length).padStart(2, "0")}</span>
            <span className="label">Registros descifrados ${seen.size}/${MISSIONS.length}</span>
          </header>
          ${phase === "done"
            ? html`<div key=${m.id}>
                <${Typewriter} text=${m.science} onDone=${() => setPoem(true)} />
                ${poem && html`<p className="poem">${m.poem}</p>`}
              </div>`
            : html`<p className="locked">▒▒▒▒▒ Registro cifrado. Sintoniza el espectro de ${m.name} hasta el final para leerlo.</p>`}
        </section>
      </main>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
